name: Saatlik Radar Motoru

on:
  schedule:
    # Her saat başı çalıştır (00. dakikada)
    - cron: '0 * * * *'
  workflow_dispatch: # İstediğin zaman manuel test etmek için

jobs:
  tara-ve-bildir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Getir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: Radarı Çalıştır
        run: python radar.py
